<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>第七颗星 · 流星心愿</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#030819;color:#fff9e9;font-family:"Microsoft YaHei",system-ui,sans-serif}.wish-world{position:relative;min-height:100svh;overflow:hidden;background:#030819}.sky{position:absolute;inset:0;background:radial-gradient(circle at 12% 20%,#fff 0 1px,transparent 2px),radial-gradient(circle at 74% 14%,#a9c9ff 0 1px,transparent 2px),radial-gradient(circle at 32% 62%,#fff6c7 0 1px,transparent 2px);background-size:170px 143px,230px 180px,280px 210px;opacity:.82}.meteor-film{position:absolute;z-index:1;inset:0;width:100%;height:100%;object-fit:cover;background:#030819}.shade{position:absolute;z-index:2;inset:0;background:linear-gradient(180deg,#02071833,transparent 36%,#020718a8);pointer-events:none}.rabbit{position:absolute;z-index:4;left:0;bottom:0;width:min(36vw,350px);height:min(54vh,470px);padding:0;border:0;background:transparent;cursor:pointer}.rabbit:focus-visible{outline:3px solid #f7d279;outline-offset:-8px;border-radius:18px}.intro{position:absolute;z-index:3;left:50%;top:10%;width:min(88vw,800px);text-align:center;transform:translateX(-50%);transition:opacity .4s}.intro p{margin:0;color:#dce7ff;font-size:13px;letter-spacing:.22em}.intro h1{margin:12px 0;font-family:STKaiti,KaiTi,serif;font-size:clamp(2.25rem,5vw,4.6rem);letter-spacing:.12em}.hint{position:absolute;z-index:4;bottom:32px;left:50%;transform:translateX(-50%);padding:10px 16px;border:1px solid #ffffff4a;border-radius:999px;background:#07122b99;color:#fff9e9;font-size:13px;white-space:nowrap;transition:opacity .3s}.bubble{position:absolute;z-index:5;top:17%;left:36%;width:min(62vw,520px);transform:translate(-50%,-16px) scale(.92);opacity:0;pointer-events:none;transition:opacity .55s ease,transform .55s cubic-bezier(.16,1,.3,1)}.bubble.show{opacity:1;transform:translate(-50%,0) scale(1)}.bubble img{display:block;width:100%;height:auto}.wish-panel{position:absolute;z-index:6;left:50%;top:50%;width:min(88vw,520px);padding:26px;border:1px solid #fff7d266;border-radius:24px;background:#081330e8;box-shadow:0 24px 80px #000a;transform:translate(-50%,-42%) scale(.94);opacity:0;pointer-events:none;transition:opacity .45s,transform .45s}.wish-panel.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}.wish-panel h2{margin:0;font-family:STKaiti,KaiTi,serif;font-size:2rem;letter-spacing:.09em}.wish-panel p{margin:9px 0 18px;color:#cbd9f7;font-size:14px;line-height:1.7}.wish-panel textarea{width:100%;min-height:110px;resize:vertical;padding:13px;border:1px solid #b9ceff66;border-radius:14px;background:#ffffff0e;color:#fffaf0;font:inherit;outline:none}.wish-panel textarea:focus{border-color:#f5d16e}.wish-panel button{width:100%;margin-top:13px;padding:12px;border:0;border-radius:14px;background:linear-gradient(135deg,#ffe18a,#f2a95c);color:#38220b;font:700 16px inherit;cursor:pointer}.blessing{display:none;margin-top:18px;padding:14px;border-radius:14px;background:#ffffff12;color:#fff6ce;line-height:1.75}.blessing.show{display:block}.wish-panel.sent textarea,.wish-panel.sent button{display:none}@media(max-width:620px){.rabbit{width:48vw;height:55vh}.bubble{top:13%;left:49%;width:88vw}.intro{top:8%}.wish-panel{padding:22px}.hint{bottom:20px}}
  </style>
</head>
<body>
  <main class="wish-world" id="world">
    <div class="sky"></div><video class="meteor-film" id="meteorFilm" muted loop playsinline preload="auto"><source src="../assets/seventh-star/meteor-shower.mkv" type="video/x-matroska" /></video><div class="shade"></div><button class="rabbit" id="rabbit" type="button" aria-label="点击左下角看流星的小兔"></button>
    <div class="bubble" id="bubble"><img src="../assets/seventh-star/meteor-bubble.png" alt="开始下流星雨了，许个愿望吧！" /></div>
    <section class="wish-panel" id="wishPanel" aria-live="polite"><h2>写下你的心愿</h2><p>让这场流星雨，把它带往星空深处。</p><textarea id="wishInput" maxlength="120" placeholder="我希望……"></textarea><button id="sendWish" type="button">把心愿交给流星</button><div class="blessing" id="blessing"></div></section>
    <div class="hint" id="hint">点击左下角小兔，听听它要说什么</div>
  </main>
  <script>
    const rabbit=document.querySelector('#rabbit'),bubble=document.querySelector('#bubble'),film=document.querySelector('#meteorFilm'),panel=document.querySelector('#wishPanel'),hint=document.querySelector('#hint'),input=document.querySelector('#wishInput'),send=document.querySelector('#sendWish'),blessing=document.querySelector('#blessing');let step=0,locked=false;
    film.addEventListener('loadeddata',()=>{film.pause();film.currentTime=0},{once:true});
    function advance(){if(locked||step>=3)return;locked=true;step++;if(step===1){bubble.classList.add('show');hint.textContent='再向下滚动，和流星一起许愿'}if(step===2){film.play().catch(()=>{});hint.textContent='流星划过夜空，写下你的心愿'}if(step===3){panel.classList.add('show');hint.style.opacity='0'}setTimeout(()=>locked=false,650)}
    rabbit.addEventListener('click',()=>{if(step===0)advance()});addEventListener('wheel',event=>{if(event.deltaY>5&&step>0)advance()},{passive:true});addEventListener('touchend',()=>{if(step>0)advance()},{passive:true});document.addEventListener('keydown',event=>{if(['ArrowDown','PageDown',' '].includes(event.key)&&step>0){event.preventDefault();advance()}});
    send.addEventListener('click',()=>{const wish=input.value.trim();if(!wish){input.focus();return}panel.classList.add('sent');blessing.textContent='小兔把“'+wish+'”轻轻放进流星的尾光里。愿它穿过漫长夜空，落在你最想抵达的地方。';blessing.classList.add('show');bubble.classList.remove('show')});
  </script>
</body>
</html>

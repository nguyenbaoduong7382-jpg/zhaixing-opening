<script>
const images=["./assets/look-02-4k.webp","./assets/look-03-4k.webp","./assets/look-04-4k.webp","./assets/look-05-4k.webp","./assets/look-06-4k.webp","./assets/look-09-4k.webp"];

const looks=[
{name:'慢调书屋',en:'SLOW AFTERNOON',desc:'格纹衬衫配针织马甲，把温柔穿进每一个平常日。',colors:['#aaa495','#d1cbbf','#49473c'],items:['格纹短袖衬衫','针织开衫马甲','翻边长裤 · 吊牌项链']},
{name:'海风来信',en:'A LETTER FROM THE SEA',desc:'浅蓝披肩和干净白衬衫，是一封写给晴天的信。',colors:['#b4bfd9','#eeeae2','#73777a'],items:['白色短袖衬衫','浅蓝水手披肩','灰色明线长裤']},
{name:'莓果假日',en:'BERRY DAYS',desc:'奶白卫衣碰上酒红裤装，流苏绳结添一点俏皮。',colors:['#f0ece5','#751f2d','#242424'],items:['印花连帽卫衣','酒红阔腿长裤','流苏抽绳 · 厚底鞋']},
{name:'红色冒险',en:'LITTLE ADVENTURER',desc:'醒目的红色背带裤，收集每一枚好奇心贴章。',colors:['#ac302c','#eee7d6','#213149'],items:['奶油色连帽内搭','贴布背带裤','蓝色纽扣 · 趣味挂件']},
{name:'午夜频率',en:'MIDNIGHT FREQUENCY',desc:'耳机、银链与暗红灯芯绒，调到属于自己的频道。',colors:['#262626','#622d39','#c3c1bd'],items:['黑色印花叠穿上衣','暗红灯芯绒长裤','酒红耳机 · 银色项链']},
{name:'星星校队',en:'THE STAR CLUB',desc:'墨绿棒球夹克，戴上金色星星，成为自己的主场。',colors:['#173b36','#eae5d8','#c5a454'],items:['拼色棒球夹克','黑色长裤 · 拼色球鞋','金色星星项链']}
];
const $=id=>document.getElementById(id);const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;let index=0,playing=!reduceMotion,elapsed=0,last=performance.now(),busy=false,pendingIndex=null,speed=1,hideTimer;

looks.forEach((l,i)=>{const b=document.createElement('button');b.className='look-card';b.setAttribute('aria-label',`第${i+1}套 ${l.name}`);b.setAttribute('aria-pressed','false');b.innerHTML=`<img src="${images[i]}" alt="" draggable="false"><span><span class="num">LOOK ${String(i+1).padStart(2,'0')}</span><strong>${l.name}</strong></span><i class="dot"></i>`;b.onclick=()=>change(i);$('lookList').append(b);const t=document.createElement('button');t.className='segment';t.setAttribute('aria-label',`切换到${l.name}`);t.innerHTML='<span class="fill"></span>';t.onclick=()=>change(i);$('timeline').append(t)});
function metadata(){const l=looks[index];$('lookTitle').textContent=l.name;$('detailTitle').textContent=l.name;$('lookEnglish').textContent=l.en;$('description').textContent=l.desc;$('currentNumber').textContent=String(index+1).padStart(2,'0');$('palette').innerHTML=l.colors.map(c=>`<span class="swatch" style="background:${c}"></span>`).join('');$('pieces').innerHTML=l.items.map((s,i)=>`<div class="piece"><em>0${i+1}</em><div><small>${['主调','搭配','点睛'][i]}</small><strong>${s}</strong></div></div>`).join('');[...$('lookList').children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));[...$('timeline').children].forEach((b,i)=>{b.setAttribute('aria-current',i===index?'true':'false');b.firstChild.style.width=i<index?'100%':'0%'});const card=$('lookList').children[index];const list=lookList,box=list.getBoundingClientRect(),item=card.getBoundingClientRect();let top=list.scrollTop,left=list.scrollLeft;if(item.top<box.top)top+=item.top-box.top;else if(item.bottom>box.bottom)top+=item.bottom-box.bottom;if(item.left<box.left)left+=item.left-box.left;else if(item.right>box.right)left+=item.right-box.right;list.scrollTo({top,left,behavior:'smooth'})}
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function change(n){n=(n+looks.length)%looks.length;if(busy){pendingIndex=n;return}if(n===index){elapsed=0;return}busy=true;elapsed=0;const target=n;const img=document.createElement('img');img.src=images[target];img.alt=looks[target].name+'，保留粉色鼻子，无嘴巴';img.className='look-prep';try{if(!img.complete)await new Promise(resolve=>{img.onload=img.onerror=resolve});if(img.decode)await img.decode().catch(()=>{});const old=$('hero');if(!reduceMotion){old.classList.add('look-exit');await wait(160)}old.remove();index=target;metadata();img.id='hero';$('currentLayer').append(img);if(!reduceMotion){await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));img.classList.remove('look-prep');img.classList.add('look-enter');await wait(300);img.classList.remove('look-enter')}}finally{busy=false;if(pendingIndex!==null){const queued=pendingIndex;pendingIndex=null;if(queued!==index)change(queued)}}}
function updatePlay(){$('play').textContent=playing?'Ⅱ':'▶';$('play').setAttribute('aria-label',playing?'暂停自动播放':'开始自动播放');$('playLabel').innerHTML=(playing?'自动换装':'已暂停')+'<small>RUNWAY · LOOP</small>'}
$('share').onclick=async()=>{const url=window.location.href;try{if(navigator.share){await navigator.share({title:'星际衣橱',text:'七套造型，一起看看我的星际衣橱',url});return}await navigator.clipboard.writeText(url);toast('分享链接已复制，发送给朋友即可')}catch(e){if(e.name==='AbortError')return;window.prompt('复制这个链接分享给朋友',url)}};
function togglePlay(){playing=!playing;updatePlay()}
$('play').onclick=togglePlay;$('prev').onclick=()=>change(index-1);$('next').onclick=()=>change(index+1);$('speed').onchange=e=>{speed=Number(e.target.value)};$('opacity').oninput=e=>{document.documentElement.style.setProperty('--bg-opacity',e.target.value/100);$('opacityValue').textContent=e.target.value+'%'};

document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)&&e.code==='Space')return;if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();togglePlay()}if(e.key==='ArrowRight'){e.preventDefault();change(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();change(index-1)}if(e.key.toLowerCase()==='f')fullscreen();if(e.key==='Escape')showMode(false)});
let startX=0;$('stage').addEventListener('touchstart',e=>startX=e.changedTouches[0].clientX,{passive:true});$('stage').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>45)change(index+(d<0?1:-1))},{passive:true});
function tick(now){const dt=Math.min(now-last,100);last=now;if(playing&&!document.hidden&&!busy){elapsed+=dt*speed;if(elapsed>=2800)change(index+1)}$('timeline').children[index].firstChild.style.width=Math.min(100,elapsed/2800*100)+'%';requestAnimationFrame(tick)}
async function start(){const results=await Promise.all(images.map(src=>new Promise(resolve=>{const im=new Image();im.onload=()=>resolve(true);im.onerror=()=>resolve(false);im.src=src})));$('hero').src=images[0];$('hero').alt=looks[0].name+'，保留粉色鼻子，无嘴巴';metadata();updatePlay();$('loading').classList.add('hidden');if(results.some(r=>!r)){playing=false;updatePlay();toast('部分图片未加载，请重新打开网页')}last=performance.now();requestAnimationFrame(tick)}start();
</script></body></html>

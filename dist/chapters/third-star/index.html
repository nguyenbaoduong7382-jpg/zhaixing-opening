<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星光消除 · Star Atelier</title><style>
*{box-sizing:border-box}body{margin:0;background:#071120;color:#fff4da;font-family:Arial,"Microsoft YaHei",sans-serif;min-height:100svh;display:grid;place-items:center}button{font:inherit;cursor:pointer}main{width:min(1440px,96vw,calc(94svh * 16 / 9));aspect-ratio:16/9;position:relative;background:#09182e;border-radius:16px;overflow:hidden;box-shadow:0 20px 70px #23362a20;border:1px solid #7894b755;container-type:inline-size}canvas{width:100%;height:100%;display:block;touch-action:none;outline:none}.hud{position:absolute;left:3%;right:3%;top:3.5%;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.brand{font-size:clamp(10px,1.4cqw,22px);font-weight:700;letter-spacing:3px}.brand small{display:block;font-size:clamp(7px,.7cqw,11px);font-weight:400;margin-top:7px;letter-spacing:2px;color:#7e8e83}.meter{width:24%;font-size:clamp(7px,.85cqw,13px);text-align:center}.track{height:3px;background:#dce3d6;margin-top:9px}.track i{display:block;height:100%;background:#77b29e;width:0;transition:width .4s}.controls{display:flex;align-items:center;gap:12px;font-size:clamp(7px,.8cqw,12px)}.controls button{pointer-events:auto;width:clamp(24px,3cqw,42px);height:clamp(24px,3cqw,42px);border:1px solid #bdc9bd;border-radius:50%;background:#ffffff70;color:#365349}.hint{position:absolute;top:64%;text-align:center;width:100%;font-size:clamp(8px,1cqw,15px);color:#8a9787;pointer-events:none}.toast{position:absolute;top:49%;text-align:center;width:100%;font-size:clamp(12px,2cqw,26px);color:#547e6c;pointer-events:none;opacity:0}.toast.pop{animation:pop 1s ease-out}@keyframes pop{20%,60%{opacity:1;transform:translateY(-10px)}100%{opacity:0;transform:translateY(-30px)}}.victory{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);padding:2cqw 4cqw;text-align:center;background:#09182ed9;border:1px solid #ead8a675;border-radius:20px;color:#fff3d2;opacity:0;visibility:hidden;transition:opacity .5s}.victory.show{opacity:1;visibility:visible}.victory h1{font-size:3cqw;margin:0 0 1cqw}.victory p{font-size:1.2cqw}.victory button{border:1px solid #ead8a675;background:#193a53;color:#fff3d2;border-radius:30px;padding:1cqw 2cqw;font-size:1.2cqw}.blocked{position:absolute;inset:0;background:#f7f7eee8;text-align:center;align-content:center}.blocked[hidden]{display:none}.blocked button{background:#b5eedc;border:1px solid #26332f;border-radius:25px;padding:12px 26px}.blocked h2{font-size:2.4cqw}.blocked p{font-size:1.1cqw}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
main::before{content:'';position:absolute;inset:0;background:url('星空背景.png') center/cover;opacity:.52;pointer-events:none}canvas{position:relative}.hud{color:#fff4da;text-shadow:0 2px 8px #071120}.brand small{color:#e1eaff}.track{background:#e0eaff35}.track i{background:#ffe5a2;box-shadow:0 0 8px #ffe5a2}.controls button{border-color:#dce8ff80;background:#102744a8;color:#fff2c7}.hint{color:#fff0ce;text-shadow:0 2px 8px #071120,0 0 12px #071120}.toast{color:#fff0aa;text-shadow:0 2px 10px #071120}.blocked{background:#09182eed;color:#fff4da}.blocked button{background:#193a53;border-color:#a5d7da;color:#fff4da}</style></head><body><main aria-label="16比9星星消除游戏"><canvas id="canvas" width="1280" height="720" tabindex="0" aria-label="拖动瞄准，松开发射。左右方向键瞄准，空格发射，X换色。"></canvas><div class="hud"><div class="brand">✦ STAR ATELIER<small>三轮挑战 / 收集星光</small></div><div class="meter">星光收集 <b id="count"></b><div class="track"><i id="progress"></i></div></div><div class="controls"><span id="pressure-label">首次发射后开始下压</span><span id="shots"></span><button id="sound" title="开启音效" aria-label="开启音效">♪</button><button id="restart" title="重新开始" aria-label="重新开始">↻</button></div></div><div class="hint" id="hint">拖动瞄准 · 松开发射 · 三颗同色相连消除 · 每12秒补入两排 · 共三次</div><div class="toast" id="toast" aria-live="polite"></div><div class="blocked" id="blocked" hidden><h2>星星到达了发射区</h2><p>换个角度，再试一次。三次下压后，清空星星即可通关。</p><button id="retry">重新挑战 ↗</button></div><section class="victory" id="win" aria-label="通关成功" aria-live="polite"><h1>✦ 通关成功</h1><p id="result"></p><button id="again">↶ 再玩一次</button></section></main><script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const colors=['#9bdcd1','#edacc2','#efd478','#b9addb'],W=1280,H=720,R=23,DX=50,DY=44,origin={x:640,y:622};
let targetAngle=-Math.PI/2,pressure=0,pressureTarget=0,pressureClock=0,descentCount=0,started=false;const PRESS_INTERVAL=12;
let board=[],particles=[],bullet=null,current=0,next=1,angle=-Math.PI/2,drag=false,shots=0,collected=0,total=0,won=false,sound=false,audio=null,winTimer=null,last=0;
const pos=(r,c)=>({x:165+c*DX+(r%2)*DX/2,y:112+r*DY+pressure});
function neighbors(a,b){let p=pos(a.r,a.c),q=pos(b.r,b.c);return Math.hypot(p.x-q.x,p.y-q.y)<53}
function pick(){let opts=[...new Set(board.map(s=>s.color))];return opts.length?opts[Math.floor(Math.random()*opts.length)]:0}
function reset(){targetAngle=-Math.PI/2;pressure=0;pressureTarget=0;pressureClock=0;descentCount=0;started=false;clearTimeout(winTimer);board=[];for(let r=0;r<5;r++)for(let c=0;c<19;c++){if(r===4&&(c<2||c>16))continue;board.push({r,c,color:(Math.floor(c/3)+Math.floor(r/2))%4,original:true})}total=board.length;shots=0;collected=0;particles=[];bullet=null;won=false;drag=false;current=pick();next=pick();document.getElementById('win').classList.remove('show');document.getElementById('blocked').hidden=true;angle=-Math.PI/2;document.getElementById('hint').style.opacity=1;updatePressureUI();update()}
function update(){document.getElementById('count').textContent=String(collected).padStart(2,'0')+' 颗';document.getElementById('shots').textContent='发射 '+String(shots).padStart(2,'0')+' 次';document.getElementById('progress').style.width=((descentCount>=3?1:Math.max(0,1-pressureClock/PRESS_INTERVAL))*100)+'%'}
function tone(freq){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);o.start();o.stop(audio.currentTime+.2)}catch{}}
function star(x,y,r,color,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,v=i%2?r*.49:r;ctx.lineTo(Math.cos(a)*v,Math.sin(a)*v)}ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#fff4d4';ctx.shadowColor=color;ctx.shadowBlur=5;ctx.lineWidth=1.5;ctx.lineJoin='round';ctx.stroke();ctx.beginPath();ctx.moveTo(-3,-r*.45);ctx.lineTo(-5,-r*.05);ctx.strokeStyle='#ffffffa0';ctx.lineWidth=2;ctx.stroke();ctx.restore()}
function ellipse(x,y,rx,ry,fill,stroke='#171d1b',angle=0){ctx.beginPath();ctx.ellipse(x,y,rx,ry,angle,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=stroke;ctx.stroke()}
function cluster(start,filter){let found=new Set([start]),queue=[start];while(queue.length){let a=queue.pop();for(let b of board)if(!found.has(b)&&neighbors(a,b)&&filter(b)){found.add(b);queue.push(b)}}return found}
function burst(s){let p=pos(s.r,s.c);for(let i=0;i<7;i++)particles.push({x:p.x,y:p.y,vx:(Math.random()-.5)*190,vy:-70-Math.random()*100,life:1,color:colors[s.color]})}
function settle(){let b=bullet;bullet=null;let candidates=[];for(let r=0;r<10;r++)for(let c=0;c<19;c++){let s={r,c,color:b.color},p=pos(r,c);if(board.some(v=>v.r===r&&v.c===c))continue;if(r===0||board.some(v=>neighbors(s,v)))candidates.push({...s,d:Math.hypot(p.x-b.x,p.y-b.y)})}candidates.sort((a,b)=>a.d-b.d);let s=candidates[0];if(!s){document.getElementById('blocked').hidden=false;return}board.push(s);let matched=cluster(s,v=>v.color===s.color),removed=new Set();if(matched.size>=3){for(let v of matched)removed.add(v);board=board.filter(v=>!removed.has(v));let anchored=new Set(),queue=board.filter(v=>v.r===0);queue.forEach(v=>anchored.add(v));while(queue.length){let a=queue.pop();for(let v of board)if(!anchored.has(v)&&neighbors(a,v)){anchored.add(v);queue.push(v)}}for(let v of board)if(!anchored.has(v))removed.add(v);board=board.filter(v=>!removed.has(v));removed.forEach(burst);collected+=Array.from(removed).filter(v=>v.original).length;tone(660);toast(removed.size>=6?'✦ 星光连连 +'+removed.size:'✧ 好闪亮 +'+removed.size)}if(!board.length){if(descentCount>=3){won=true;drag=false;winTimer=setTimeout(()=>{document.getElementById('result').textContent='星光已集齐 · '+shots+' 次发射';document.getElementById('win').classList.add('show');tone(880)},900)}else{document.getElementById('hint').textContent='本轮已清空，等待下一轮星星';document.getElementById('hint').style.opacity=1}}else if(board.some(v=>pos(v.r,v.c).y+R>=548)){document.getElementById('blocked').hidden=false;}current=board.some(v=>v.color===next)?next:pick();next=pick();update()}
function toast(text){let e=document.getElementById('toast');e.textContent=text;e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}
function fire(){if(bullet||won||!board.length||!document.getElementById('blocked').hidden)return;started=true;bullet={...origin,vx:Math.cos(angle)*820,vy:Math.sin(angle)*820,color:current};shots++;tone(330);document.getElementById('hint').style.opacity=0;update()}
function point(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function aim(p){targetAngle=Math.max(-Math.PI+.17,Math.min(-.17,Math.atan2(p.y-origin.y,p.x-origin.x)))}
canvas.addEventListener('pointerdown',e=>{if(won||bullet)return;let p=point(e);if(Math.hypot(p.x-785,p.y-638)<35){[current,next]=[next,current];tone(440);return}if(p.y>origin.y)return;drag=true;aim(p);canvas.setPointerCapture(e.pointerId);canvas.focus()});canvas.addEventListener('pointermove',e=>{if((drag||e.pointerType==='mouse')&&!won&&document.getElementById('blocked').hidden&&point(e).y<origin.y)aim(point(e))});canvas.addEventListener('pointerup',e=>{if(drag){aim(point(e));drag=false;fire()}});canvas.addEventListener('pointercancel',()=>drag=false);canvas.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','x','X'].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft')targetAngle=Math.max(-Math.PI+.17,targetAngle-.09);if(e.key==='ArrowRight')targetAngle=Math.min(-.17,targetAngle+.09);if(e.key===' ')fire();if(e.key.toLowerCase()==='x'&&!bullet)[current,next]=[next,current]}});
document.getElementById('restart').onclick=reset;document.getElementById('again').onclick=reset;document.getElementById('sound').onclick=()=>{sound=!sound;let e=document.getElementById('sound');e.style.background=sound?'#387078':'#102744a8';e.setAttribute('aria-label',sound?'关闭音效':'开启音效');e.title=sound?'关闭音效':'开启音效';e.textContent=sound?'♫':'♪';tone(550)};

document.getElementById('retry').onclick=reset;
function cannon(t){
ctx.save();ctx.translate(origin.x,origin.y);
ctx.shadowColor='#68dfdf66';ctx.shadowBlur=25;ellipse(0,53,73,15,'#101b20','#4b6b72');ctx.shadowBlur=0;
let base=ctx.createLinearGradient(0,20,0,62);base.addColorStop(0,'#718e95');base.addColorStop(.35,'#253b45');base.addColorStop(1,'#101b25');
ctx.fillStyle=base;ctx.beginPath();ctx.roundRect(-57,22,114,32,12);ctx.fill();ctx.strokeStyle='#82a5aa';ctx.stroke();
ellipse(0,24,50,17,'#20303a','#b9c9bd');ellipse(0,21,38,11,'#6ba9ae','#1a2a34');
ctx.save();ctx.rotate(angle+Math.PI/2);let metal=ctx.createLinearGradient(-26,0,26,0);metal.addColorStop(0,'#172934');metal.addColorStop(.2,'#698f94');metal.addColorStop(.38,'#c3ebe4');metal.addColorStop(.58,'#5b9096');metal.addColorStop(1,'#152c39');
ctx.fillStyle=metal;ctx.strokeStyle='#14252f';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-25,-62,50,91,12);ctx.fill();ctx.stroke();
ctx.fillStyle='#e0c88c';ctx.fillRect(-27,-54,54,7);ctx.fillRect(-26,-5,52,5);
ctx.fillStyle='#182833';ctx.beginPath();ctx.roundRect(-29,-69,58,17,6);ctx.fill();ctx.strokeStyle='#9cbab8';ctx.stroke();
ctx.fillStyle='#85e2dc';ctx.shadowBlur=12;ctx.shadowColor='#85e2dc';ctx.fillRect(-19,-64,38,4);ctx.shadowBlur=0;
for(let x of [-15,15]){ctx.fillStyle='#d5d3ba';ctx.beginPath();ctx.arc(x,10,2,0,7);ctx.fill()}
star(0,-28,12,'#f1d795');ctx.restore();ellipse(0,18,20,20,'#22333e','#c6b785');ellipse(0,18,12,12,'#73c6c3','#304e59');
ctx.restore();if(!bullet&&!won)star(origin.x+Math.cos(angle)*80,origin.y+Math.sin(angle)*80,22,colors[current]);
ellipse(785,638,31,31,'#18252b','#52666c');star(785,638,19,colors[next]);ctx.fillStyle='#fff0ce';ctx.textAlign='center';ctx.font='12px Arial';ctx.fillText('换色 ⇄',785,687);
}
function updatePressureUI(){let e=document.getElementById('pressure-label');e.textContent=won?'星光已清空':!document.getElementById('blocked').hidden?'挑战结束':!started?'首次发射后开始下压':descentCount>=3?'下压完成 3/3 · 清空剩余星星':'下压 '+descentCount+'/3 · '+Math.max(0,Math.ceil(PRESS_INTERVAL-pressureClock))+'s';e.style.color=started&&pressureClock>=9?'#ffbd92':'#fff4da'}
function addRows(n,animate){for(let v of board)v.r+=n;for(let r=0;r<n;r++)for(let c=0;c<19;c++){board.push({r,c,color:Math.floor(c/3+Math.floor(Math.random()*2))%4,original:true})}total+=19*n;if(animate)pressure-=n*DY;pressureTarget=0;update()}
function stepMotion(dt){angle+=(targetAngle-angle)*(1-Math.exp(-22*dt));if(!started||won||!document.getElementById('blocked').hidden||document.hidden)return;if(descentCount<3){pressureClock+=dt;if(pressureClock>=PRESS_INTERVAL){pressureClock-=PRESS_INTERVAL;descentCount++;addRows(2,true);document.getElementById('hint').style.opacity=0;tone(210)}}pressure+=(pressureTarget-pressure)*(1-Math.exp(-8*dt));if(Math.abs(pressureTarget-pressure)<.1)pressure=pressureTarget;if(board.some(v=>pos(v.r,v.c).y+R>=548)){document.getElementById('blocked').hidden=false;drag=false;bullet=null}updatePressureUI();update()}
document.addEventListener('visibilitychange',()=>{last=performance.now();drag=false});
function frame(t){let dt=Math.min((t-last)/1000,.032);last=t;stepMotion(dt);ctx.clearRect(0,0,W,H);
ctx.save();ctx.strokeStyle='#ffbd9270';ctx.setLineDash([6,8]);ctx.beginPath();ctx.moveTo(28,548);ctx.lineTo(W-28,548);ctx.stroke();ctx.restore();ctx.strokeStyle='#d6e6ff55';ctx.setLineDash([3,7]);ctx.beginPath();ctx.moveTo(28,92);ctx.lineTo(28,546);ctx.moveTo(W-28,92);ctx.lineTo(W-28,546);ctx.stroke();ctx.setLineDash([]);
for(let s of board){let p=pos(s.r,s.c);star(p.x,p.y,24,colors[s.color],Math.sin(s.r*3+s.c)*.08)}
if(!won&&!bullet){ctx.save();ctx.setLineDash([2,11]);ctx.lineCap='round';ctx.strokeStyle='#fff0b5';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(origin.x,origin.y);let x=origin.x,y=origin.y,vx=Math.cos(angle),vy=Math.sin(angle);for(let i=0;i<350;i++){x+=vx*5;y+=vy*5;if(x<R||x>W-R){vx=-vx;x=Math.max(R,Math.min(W-R,x))}ctx.lineTo(x,y);if(y<=112+pressure||board.some(s=>{let p=pos(s.r,s.c);return Math.hypot(p.x-x,p.y-y)<46}))break}ctx.stroke();ctx.restore()}
ctx.fillStyle='#080f19c9';ctx.fillRect(0,566,W,H-566);ctx.strokeStyle='#a1badb25';ctx.lineWidth=1;for(let x=0;x<W;x+=32){ctx.beginPath();ctx.moveTo(x,566);ctx.lineTo(x,H);ctx.stroke()}for(let y=566;y<H;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.fillStyle='#c4dcff66';ctx.fillRect(0,564,W,2);cannon(t);
if(bullet){for(let i=0;i<5&&bullet;i++){bullet.x+=bullet.vx*dt/5;bullet.y+=bullet.vy*dt/5;if(bullet.x<R||bullet.x>W-R){bullet.vx*=-1;bullet.x=Math.max(R,Math.min(W-R,bullet.x))}if(bullet.y<=112+pressure||board.some(s=>{let p=pos(s.r,s.c);return Math.hypot(p.x-bullet.x,p.y-bullet.y)<46}))settle()}if(bullet){ctx.save();ctx.shadowColor=colors[bullet.color];ctx.shadowBlur=18;star(bullet.x,bullet.y,23,colors[bullet.color],t/350);ctx.restore()}}
for(let p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;ctx.globalAlpha=Math.max(0,p.life);star(p.x,p.y,7,p.color,t/150)}ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0);requestAnimationFrame(frame)}
reset();requestAnimationFrame(frame);</script></body></html>

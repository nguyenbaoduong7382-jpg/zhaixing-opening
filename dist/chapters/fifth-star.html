<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>和默默玩一会</title>
  <style>
    :root{--ink:#112b47;--paper:#fffaf0;--gold:#f5c45b;--blue:#44c8de}*{box-sizing:border-box}body{margin:0;background:#071121;color:var(--ink);font-family:"Microsoft YaHei",system-ui,sans-serif;overflow:hidden}.playroom{min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr) minmax(350px,31vw);background:#071121}.scene{position:relative;overflow:hidden;isolation:isolate;background:#10233e}.scene-bg{position:absolute;inset:0;background:center/cover no-repeat;z-index:-3;transition:opacity .16s linear}.scene-bg.base{background-image:url("../assets/play-tent.png")}.scene-bg.next{opacity:0}.scene::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 62%,transparent 0 22%,#06111f55 78%);pointer-events:none;z-index:-1}.scene-particles{position:absolute;inset:0;z-index:1;pointer-events:none}.scene-copy{position:absolute;z-index:2;top:clamp(28px,6vh,72px);left:clamp(28px,6vw,90px);max-width:310px;color:#fff9e8;text-shadow:0 3px 14px #071121}.scene-copy p{margin:0 0 10px;font-size:11px;letter-spacing:.22em;opacity:.86}.scene-copy h1{margin:0;font-family:STKaiti,KaiTi,serif;font-size:clamp(2rem,3vw,4rem);line-height:1.08;letter-spacing:.08em}.scene-copy small{display:block;margin-top:15px;font-size:14px;line-height:1.8}.momo{position:absolute;z-index:2;left:48%;top:55%;width:clamp(180px,25vw,410px);aspect-ratio:2/3;touch-action:none;cursor:grab;transform:translate(-50%,-50%) translate(var(--drag-x,0px),var(--drag-y,0px)) scale(var(--momo-scale,.72));transform-origin:center bottom;filter:drop-shadow(0 30px 28px #00102088);user-select:none}.momo.dragging{cursor:grabbing}.momo.idle{animation:bob 2.8s ease-in-out infinite}.momo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.momo .action-art{display:none}.momo.action-playing .idle-art{opacity:0}.momo.action-playing .action-art{display:block}.bubble{position:absolute;z-index:3;left:54%;top:22%;max-width:210px;padding:12px 17px;border:1px solid #fff8dc99;border-radius:999px;background:#fffdf4ed;box-shadow:0 10px 24px #06111f40;color:#25465c;font-size:14px;line-height:1.4;transform:translate(-50%,-50%);pointer-events:none}.bubble::after{content:"";position:absolute;left:30px;bottom:-8px;width:15px;height:15px;background:#fffdf4ed;transform:rotate(45deg);border-right:1px solid #fff8dc99;border-bottom:1px solid #fff8dc99}.hint{position:absolute;z-index:2;bottom:30px;left:50%;transform:translateX(-50%);padding:9px 14px;border-radius:999px;background:#0711218c;color:#fff7d7;font-size:13px;white-space:nowrap}.video-stage{position:absolute;z-index:6;inset:0;display:grid;place-items:center;padding:clamp(24px,5vw,70px);background:#06111fd9;opacity:0;pointer-events:none;transition:opacity .25s ease}.video-stage.show{opacity:1;pointer-events:auto}.video-stage video{width:min(100%,720px);height:min(80svh,720px);object-fit:contain;border:1px solid #fff7cf66;border-radius:18px;background:#000;box-shadow:0 25px 70px #000}.close-video{position:absolute;z-index:1;top:22px;right:24px;border:1px solid #fff7cf88;border-radius:999px;background:#081526d9;color:#fff9e8;padding:9px 14px;font:inherit;cursor:pointer}.panel{padding:clamp(24px,4vw,62px) clamp(18px,3vw,42px);overflow:auto;background:linear-gradient(180deg,#fffdf6,#f2e7d1);box-shadow:-20px 0 50px #00122833}.eyebrow{margin:0;color:#58728d;font-size:12px;font-weight:700;letter-spacing:.18em}.panel h2{margin:14px 0 8px;font-size:clamp(1.55rem,2.2vw,2.3rem);letter-spacing:.08em}.sub{margin:0 0 24px;color:#6c7a89;font-size:14px;line-height:1.65}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.action{min-height:124px;padding:16px 12px;border:1px solid #d9cfc033;border-radius:19px;background:#fffdf8;box-shadow:0 7px 15px #5b463015;color:#173752;text-align:left;cursor:pointer}.action:focus-visible{outline:3px solid #42bdd3;outline-offset:3px}.action.selected{border-color:#48bcd1;background:#effcff;box-shadow:0 8px 22px #279bc135}.action .icon{display:block;color:#0b6e9a;font-size:28px;line-height:1;margin-bottom:10px}.action strong{display:block;font-size:16px}.action span{display:block;margin-top:6px;color:#7d8893;font-size:12px;line-height:1.4}.controls{margin-top:26px}.controls label{display:flex;justify-content:space-between;font-size:14px;font-weight:700}.controls output{color:#6c8399}.controls input{width:100%;accent-color:#1885b4;margin-top:13px}.reset{width:100%;margin-top:15px;padding:12px;border:1px solid #cdd6d6;border-radius:12px;background:transparent;color:#28445b;font:inherit;cursor:pointer}@keyframes bob{50%{translate:0 -12px}}@media(max-width:760px){body{overflow:auto}.playroom{min-height:100svh;display:flex;flex-direction:column}.scene{height:62svh;min-height:460px}.scene-copy{top:25px;left:25px}.scene-copy h1{font-size:2rem}.scene-copy small{font-size:12px}.momo{left:50%;top:62%;width:250px}.bubble{top:27%;left:56%;font-size:12px}.hint{bottom:18px;font-size:12px}.panel{padding:25px 18px 35px}.panel h2{font-size:1.6rem}.action{min-height:106px}.actions{gap:10px}.video-stage{padding:18px}.video-stage video{height:min(72svh,620px)}}
  </style>
  <style>
    /* 视频动作沿用互动房间的场景切换，而非全屏播放层。 */
    .video-stage{z-index:3;display:grid;place-items:center;inset:auto;left:50%;top:55%;width:min(58vw,580px);height:min(72vh,680px);padding:0;background:transparent;transform:translate(-50%,-50%);opacity:0;pointer-events:none}
    .video-stage{display:none}.video-stage.show{display:none}.close-video{display:none}.momo canvas.video-art{position:absolute;inset:0;width:100%;height:100%;display:none;object-fit:contain}.momo.action-playing canvas.video-art{display:block}.momo.video-action #actionImage{display:none!important}
    @media(max-width:760px){.video-stage{top:61%;width:min(92vw,480px);height:min(58vh,520px)}}
  </style>
</head>
<body>
  <main class="playroom">
    <section class="scene" aria-label="默默的互动场景">
      <div class="scene-bg base" id="sceneCurrent"></div><div class="scene-bg next" id="sceneNext"></div><canvas class="scene-particles" id="sceneParticles" aria-hidden="true"></canvas>
      <div class="scene-copy"><p>PLAY TOGETHER</p><h1>把一颗星，<br>留在身边。</h1><small>拖动默默到你喜欢的位置，<br>再选择一件想一起做的事。</small></div>
      <div class="bubble" id="bubble" aria-live="polite">嗨，想和我做什么？</div>
      <div class="momo idle" id="momo" role="button" tabindex="0" aria-label="可拖动的默默">
        <img class="idle-art" src="../assets/momo-idle.webp" alt="戴着耳机的默默" draggable="false" />
        <img class="action-art" id="actionImage" alt="默默的动作" draggable="false" />
        <canvas class="action-art video-art" id="materialCanvas" aria-label="默默的动作视频"></canvas>
      </div>
      <div class="hint">按住并拖动默默</div>
      <div class="video-stage" id="videoStage" aria-hidden="true"><button class="close-video" id="closeVideo" type="button">回到互动房间</button><video id="materialVideo" muted playsinline></video></div>
    </section>
    <aside class="panel" aria-label="默默的动作选择">
      <p class="eyebrow">PLAY TOGETHER</p><h2>与默默玩一会</h2><p class="sub">每个动作都是一段完整的小故事。</p>
      <div class="actions">
        <button class="action" data-image="parcel.webp" data-scene="parcel-crystal-warehouse.png" data-line="拆开看看，里面藏着什么？"><i class="icon">◇</i><strong>拆快递</strong><span>拆出小惊喜</span></button>
        <button class="action" data-image="singing.webp" data-scene="singing-scene.png" data-line="我来唱一段闪亮的旋律。"><i class="icon">♫</i><strong>唱歌</strong><span>唱出闪亮心情</span></button>
        <button class="action" data-image="reading.webp" data-scene="reading-library.png" data-line="安静地陪你读一会书。"><i class="icon">▤</i><strong>看书</strong><span>和你一起安静</span></button>
        <button class="action" data-image="watering.webp" data-scene="watering-garden.png" data-line="给小植物喝点水吧。"><i class="icon">♧</i><strong>浇花</strong><span>给小植物喝水</span></button>
        <button class="action" data-video="holding-star.mp4" data-scene="action-background.png" data-line="把星星高高举起，点亮这一刻。"><i class="icon">★</i><strong>举星星</strong><span>播放你的素材</span></button>
        <button class="action" data-video="trumpet.mp4" data-scene="action-background.png" data-line="听，星星的声音从喇叭里吹出来了。"><i class="icon">♫</i><strong>吹喇叭</strong><span>播放你的素材</span></button>
      </div>
      <div class="controls"><label for="size">默默大小 <output id="sizeValue">72%</output></label><input id="size" type="range" min="48" max="100" value="72" /></div>
      <button class="reset" id="reset" type="button">回到原位</button>
    </aside>
  </main>
  <script>
    const momo=document.querySelector('#momo'),actionImage=document.querySelector('#actionImage'),bubble=document.querySelector('#bubble'),size=document.querySelector('#size'),sizeValue=document.querySelector('#sizeValue'),reset=document.querySelector('#reset'),scene=document.querySelector('.scene'),sceneCurrent=document.querySelector('#sceneCurrent'),sceneNext=document.querySelector('#sceneNext'),particleCanvas=document.querySelector('#sceneParticles'),videoStage=document.querySelector('#videoStage'),materialVideo=document.querySelector('#materialVideo'),materialCanvas=document.querySelector('#materialCanvas'),closeVideo=document.querySelector('#closeVideo');let x=0,y=0,drag=false,startX=0,startY=0,sceneRaf=0,videoRaf=0,keyMask,keyQueue,keyW=0,keyH=0;
    const place=()=>{momo.style.setProperty('--drag-x',x+'px');momo.style.setProperty('--drag-y',y+'px')};
    momo.addEventListener('pointerdown',e=>{drag=true;startX=e.clientX-x;startY=e.clientY-y;momo.setPointerCapture(e.pointerId);momo.classList.remove('idle');momo.classList.add('dragging');bubble.textContent='带我去看看新地方。'});
    momo.addEventListener('pointermove',e=>{if(!drag)return;const box=momo.parentElement.getBoundingClientRect();x=Math.max(-box.width*.36,Math.min(box.width*.36,e.clientX-startX));y=Math.max(-box.height*.3,Math.min(box.height*.28,e.clientY-startY));place()});
    momo.addEventListener('pointerup',()=>{drag=false;momo.classList.remove('dragging');if(!momo.classList.contains('playing'))momo.classList.add('idle')});
    momo.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();bubble.textContent='你可以用鼠标或手指拖动我。'}});
    function revealGarden(image,origin){const rect=scene.getBoundingClientRect(),ctx=particleCanvas.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2),w=rect.width,h=rect.height,ox=origin.left+origin.width/2-rect.left,oy=origin.top+origin.height/2-rect.top;particleCanvas.width=Math.round(w*dpr);particleCanvas.height=Math.round(h*dpr);particleCanvas.style.width=w+'px';particleCanvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);const source=new Image();source.onload=()=>{const sampler=document.createElement('canvas'),sampleCtx=sampler.getContext('2d');sampler.width=Math.max(1,Math.round(w));sampler.height=Math.max(1,Math.round(h));const scale=Math.max(w/source.width,h/source.height),dw=source.width*scale,dh=source.height*scale;sampleCtx.drawImage(source,(w-dw)/2,(h-dh)/2,dw,dh);const pixels=sampleCtx.getImageData(0,0,sampler.width,sampler.height).data,particles=Array.from({length:460},()=>{const tx=Math.random()*w,ty=Math.random()*h,ix=Math.min(sampler.width-1,Math.round(tx)),iy=Math.min(sampler.height-1,Math.round(ty)),i=(iy*sampler.width+ix)*4;return{tx,ty,c:`rgb(${pixels[i]},${pixels[i+1]},${pixels[i+2]})`,r:1.5+Math.random()*3.8,delay:Math.random()*.34}});sceneNext.style.backgroundImage='url("../assets/scenes/'+image+'")';sceneNext.style.clipPath='none';sceneNext.style.transform='scale(1.06)';sceneNext.style.opacity=0;const start=performance.now();cancelAnimationFrame(sceneRaf);function frame(now){const t=Math.min(1,(now-start)/1250),reveal=Math.max(0,Math.min(1,(t-.32)/.48));ctx.clearRect(0,0,w,h);ctx.globalCompositeOperation='screen';particles.forEach(p=>{const local=Math.max(0,Math.min(1,(t-p.delay)/.62));if(!local)return;const eased=1-Math.pow(1-local,3),x=ox+(p.tx-ox)*eased,y=oy+(p.ty-oy)*eased;ctx.globalAlpha=(1-local)*.92+.1;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(x,y,Math.max(.4,p.r*(1-local*.56)),0,Math.PI*2);ctx.fill()});ctx.globalCompositeOperation='source-over';sceneNext.style.opacity=reveal;sceneNext.style.transform=`scale(${1.06-reveal*.06})`;if(t<1)sceneRaf=requestAnimationFrame(frame);else{sceneCurrent.style.backgroundImage=sceneNext.style.backgroundImage;sceneNext.style.opacity=0;sceneNext.style.transform='none';ctx.clearRect(0,0,w,h)}}sceneRaf=requestAnimationFrame(frame)};source.src='../assets/scenes/'+image}
    function revealScene(image,origin){if(image==='watering-garden.png'||image==='parcel-crystal-warehouse.png'||image==='reading-library.png'){revealGarden(image,origin);return}const rect=scene.getBoundingClientRect(),ctx=particleCanvas.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2),w=rect.width,h=rect.height;particleCanvas.width=Math.round(w*dpr);particleCanvas.height=Math.round(h*dpr);particleCanvas.style.width=w+'px';particleCanvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);sceneNext.style.backgroundImage='url("../assets/scenes/'+image+'")';sceneNext.style.opacity=1;const ox=(origin.left+origin.width/2-rect.left),oy=(origin.top+origin.height/2-rect.top);const particles=Array.from({length:240},()=>{const a=Math.random()*Math.PI*2,s=2+Math.random()*10;return{x:ox,y:oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:1+Math.random()*4,life:.92+Math.random()*.38,c:Math.random()>.5?'#8cf7ff':'#fff3ab'}});const start=performance.now();cancelAnimationFrame(sceneRaf);function frame(now){const t=Math.min(1,(now-start)/980);ctx.clearRect(0,0,w,h);ctx.globalCompositeOperation='screen';particles.forEach(p=>{p.x+=p.vx*(1-t*.45);p.y+=p.vy*(1-t*.45);p.vy+=.018;p.life-=.012;ctx.globalAlpha=Math.max(0,p.life)*(1-t*.42);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.4,p.r*(1-t*.45)),0,Math.PI*2);ctx.fill()});ctx.globalCompositeOperation='source-over';sceneNext.style.clipPath='circle('+(t*145)+'% at '+ox+'px '+oy+'px)';if(t<1)sceneRaf=requestAnimationFrame(frame);else{sceneCurrent.style.backgroundImage=sceneNext.style.backgroundImage;sceneNext.style.opacity=0;sceneNext.style.clipPath='none';ctx.clearRect(0,0,w,h)}}sceneRaf=requestAnimationFrame(frame)}
    function stopMaterial(){cancelAnimationFrame(videoRaf);videoRaf=0;materialVideo.pause();materialVideo.removeAttribute('src');materialVideo.load();momo.classList.remove('video-action');const ctx=materialCanvas.getContext('2d');ctx.clearRect(0,0,materialCanvas.width,materialCanvas.height);videoStage.classList.remove('show');videoStage.setAttribute('aria-hidden','true');scene.classList.remove('video-playing');}
    function paintMaterial(){if(materialVideo.readyState<2)return;const w=materialVideo.videoWidth,h=materialVideo.videoHeight;if(!w||!h)return;if(materialCanvas.width!==w||materialCanvas.height!==h){materialCanvas.width=w;materialCanvas.height=h}const ctx=materialCanvas.getContext('2d',{willReadFrequently:true});ctx.clearRect(0,0,w,h);ctx.drawImage(materialVideo,0,0,w,h);const frame=ctx.getImageData(0,0,w,h),data=frame.data,points=[[2,2],[w-3,2],[2,h-3],[w-3,h-3]];let r=0,g=0,b=0;points.forEach(([px,py])=>{const i=(py*w+px)*4;r+=data[i];g+=data[i+1];b+=data[i+2]});r/=4;g/=4;b/=4;const size=w*h;if(keyW!==w||keyH!==h){keyW=w;keyH=h;keyMask=new Uint8Array(size);keyQueue=new Int32Array(size)}keyMask.fill(0);let tail=0,head=0;const add=i=>{if(!keyMask[i]){keyMask[i]=1;keyQueue[tail++]=i}};const similar=i=>{const p=i*4;return Math.hypot(data[p]-r,data[p+1]-g,data[p+2]-b)<78};for(let px=0;px<w;px++){if(similar(px))add(px);if(similar((h-1)*w+px))add((h-1)*w+px)}for(let py=1;py<h-1;py++){if(similar(py*w))add(py*w);if(similar(py*w+w-1))add(py*w+w-1)}while(head<tail){const i=keyQueue[head++],x=i%w;if(i>=w&&similar(i-w))add(i-w);if(i<size-w&&similar(i+w))add(i+w);if(x&&similar(i-1))add(i-1);if(x<w-1&&similar(i+1))add(i+1)}for(let i=0;i<size;i++)if(keyMask[i])data[i*4+3]=0;ctx.putImageData(frame,0,0);videoRaf=requestAnimationFrame(paintMaterial)}
    function playMaterial(src){stopMaterial();materialVideo.src='../assets/fifth-star/'+src;materialVideo.onloadeddata=()=>{momo.classList.remove('idle');momo.classList.add('action-playing','video-action');actionImage.removeAttribute('src');materialVideo.play().then(()=>{cancelAnimationFrame(videoRaf);paintMaterial()}).catch(()=>{})};}
    closeVideo.addEventListener('click',stopMaterial);
    document.querySelectorAll('.action').forEach(button=>button.addEventListener('click',event=>{document.querySelectorAll('.action').forEach(item=>item.classList.remove('selected'));button.classList.add('selected');bubble.textContent=button.dataset.line;if(button.dataset.video){revealScene(button.dataset.scene,button.getBoundingClientRect());playMaterial(button.dataset.video);return}stopMaterial();revealScene(button.dataset.scene,button.getBoundingClientRect());actionImage.src='';actionImage.src='../assets/play/'+button.dataset.image;momo.classList.remove('idle');momo.classList.add('action-playing');}));
    size.addEventListener('input',()=>{const value=size.value;sizeValue.value=value+'%';momo.style.setProperty('--momo-scale',value/100)});
    reset.addEventListener('click',()=>{stopMaterial();x=0;y=0;place();actionImage.removeAttribute('src');momo.classList.remove('action-playing');momo.classList.add('idle');document.querySelectorAll('.action').forEach(item=>item.classList.remove('selected'));bubble.textContent='我回到这里等你。'});
  </script>
</body>
</html>

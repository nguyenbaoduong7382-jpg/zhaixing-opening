<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#030708" />
  <meta name="description" content="摘星互动叙事网站" />
  <title>摘星</title>
  <link rel="stylesheet" href="./styles.css?v=cold-start-4" />
</head>
<body>
  <audio id="backgroundMusic" src="./assets/background-music.m4a" loop preload="none"></audio>
    <button class="sound-button" id="soundButton" type="button" aria-label="播放背景音乐" aria-pressed="false">
      <span class="sound-off" aria-hidden="true">◖</span><span class="sound-on" aria-hidden="true">♪</span>
    </button>
  <span id="musicStatus" class="music-status" role="status" hidden></span>
  <main class="opening" id="opening">
    <div class="media" aria-hidden="true">
      <video id="openingVideo" muted playsinline preload="none" poster="./assets/opening-poster.jpg">
        
      </video>
      <canvas class="held-frame" id="openingFrame" aria-hidden="true"></canvas>
      <div class="edge-shade"></div>
      <div class="paper-grain"></div>
    </div>

    <div class="opening-controls"><span id="openingStatus" role="status">正在准备开场，请稍候…</span><button id="openingRetry" type="button" hidden>重试</button><button id="skipOpening" type="button">跳过开场 →</button></div><div class="scrub" id="scrubProgress" role="progressbar" aria-label="开屏视频进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span class="scroll-cue" aria-hidden="true"><i></i></span>
      <div class="scrub-track"><i></i><b aria-hidden="true">★</b></div>
    </div>
  </main>
  <section class="story-preview" id="storyPreview" aria-labelledby="storyTitle" hidden>
    <div class="story-stage" id="storyStage">
      <div class="story-visual">
        <canvas class="story-film held-frame" id="storyFrame" aria-hidden="true"></canvas>
        <div id="storyLoading" class="story-loading" role="status">正在准备星空，请等待加载完成后再滑动…</div>
        <canvas id="starfieldCanvas" aria-hidden="true"></canvas>
        <div class="interactive-stars" aria-label="可互动的星星">
          <button class="burst-star star-a" type="button" aria-label="点击释放星光">★</button>
          <button class="burst-star star-b" type="button" aria-label="点击释放星光">★</button>
          <button class="burst-star star-c" type="button" aria-label="点击释放星光">★</button>
          <button class="burst-star star-d" type="button" aria-label="点击释放星光">★</button>
        </div>
        <p class="click-hint">点击发光星星 · 释放星光</p>
      </div>
      <div class="story-flow" id="storyTitle" aria-live="polite"></div>
      <div class="stage-progress" aria-hidden="true"><i></i></div>
      <button class="back-button" id="backButton" type="button" aria-label="返回开屏">↙</button>
    </div>
    <section class="chapter-panel chapter-two" aria-labelledby="chapterTwoTitle">
      <header><span>02</span><h2 id="chapterTwoTitle">第二颗星 · 兔子星球</h2></header>
      <iframe data-src="./chapters/second-star.html?v=instant-scenes" title="第二颗星：兔子星球角色互动档案" loading="lazy"></iframe>
    </section>
    <section class="chapter-panel chapter-three" aria-labelledby="chapterThreeTitle">
      <header><span>03</span><h2 id="chapterThreeTitle">第三颗星 · 星光消除</h2></header>
      <iframe data-src="./chapters/third-star/index.html" title="第三颗星：星光消除互动游戏" loading="lazy"></iframe>
    </section>
    <section class="chapter-panel chapter-four" aria-labelledby="chapterFourTitle">
      <header><span>04</span><h2 id="chapterFourTitle">第四颗星 · 星际衣橱</h2></header>
      <iframe data-src="./chapters/fourth-star/index.html?v=local-scroll-2" title="第四颗星：星际衣橱互动展览" loading="lazy"></iframe>
    </section>
    <section class="chapter-panel chapter-five" aria-labelledby="chapterFiveTitle">
      <header><span>05</span><h2 id="chapterFiveTitle">第五颗星 · 和默默玩一会</h2></header>
      <iframe data-src="./chapters/fifth-star.html?v=reading-particles" title="第五颗星：和默默玩一会" loading="lazy"></iframe>
    </section>
    <section class="chapter-panel chapter-six" aria-labelledby="chapterSixTitle">
      <header><span>06</span><h2 id="chapterSixTitle">第六颗星 · 无限螺旋研究</h2></header>
      <iframe data-src="./chapters/sixth-star/index.html" title="第六颗星：无限螺旋研究" loading="lazy"></iframe>
    </section>
    <section class="chapter-panel chapter-seven" aria-labelledby="chapterSevenTitle">
      <header><span>07</span><h2 id="chapterSevenTitle">第七颗星 · 流星心愿</h2></header>
      <iframe data-src="./chapters/seventh-star.html?v=mp4-1" title="第七颗星：流星心愿" loading="lazy"></iframe>
    </section>
  </section>
  <script src="./vendor/gsap.min.js" defer></script>
  <script src="./vendor/ScrollTrigger.min.js" defer></script>
  <script src="./story-sequence.js?v=bundle-5" defer></script>
  <script src="./app.js?v=bundle-5" defer></script>
</body>
</html>
